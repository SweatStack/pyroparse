[project]
name = "pyroparse"
version = "0.11.0"
description = "Fast and opinionated activity data parsing. Forged in Rust. Fired up in Python."
readme = "README.md"
authors = [{ name = "Aart Goossens", email = "aart@sweatstack.no" }]
requires-python = ">=3.10"
dependencies = ["pyarrow>=14.0", "tqdm>=4.60", "open-sport-taxonomy>=0.10,<0.12"]

[project.optional-dependencies]
server = ["starlette", "uvicorn[standard]", "python-multipart"]
dev = ["pytest>=7.0", "maturin>=1.9.4"]
scripts = ["polars", "duckdb>=1.1", "sweatstack", "httpx", "matplotlib"]

[project.scripts]
pyroparse = "pyroparse.__main__:main"

[build-system]
# maturin >= 1.9.4 sets PYO3_BUILD_EXTENSION_MODULE, which replaces PyO3's
# extension-module feature.
requires = ["maturin>=1.9.4,<2.0"]
build-backend = "maturin"

[tool.maturin]
module-name = "pyroparse._core"
python-source = "src"

[tool.cibuildwheel]
# The extension uses the stable ABI (PyO3 `abi3-py310`): one wheel per platform,
# built on cp310, runs on every later CPython. cibuildwheel reuses that wheel for
# each newer version below and runs the tests there, so every supported Python
# is tested. Add the next CPython here when it is released.
build = "cp310-* cp311-* cp312-* cp313-* cp314-* cp315-*"
# Free-threaded CPython (cp3XXt) cannot load abi3 wheels; supporting it means
# an `abi3t` build (3.15+) and a thread-safety review, not a config line.
skip = "*-win32 *-manylinux_i686 cp3??t-*"
test-requires = ["pytest", "tzdata"]
test-command = "pytest {project}/tests -x --no-header -q"

[tool.cibuildwheel.linux]
before-all = "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y"
environment = { PATH = "$HOME/.cargo/bin:$PATH" }

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }

[tool.cibuildwheel.windows]
# PyArrow's C++ layer on Windows looks for IANA timezone data at
# %USERPROFILE%\Downloads\tzdata — which doesn't exist on CI runners.
# Copy it there from the tzdata Python package (in test-requires).
# See: https://github.com/apache/arrow/issues/36991
before-test = "pip install tzdata && python -c \"import shutil,pathlib,importlib.resources as ir; shutil.copytree(ir.files('tzdata')/'zoneinfo', pathlib.Path.home()/'Downloads'/'tzdata', dirs_exist_ok=True)\""

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "matplotlib>=3.10.8",
    "maturin>=1.12.6",
    "pytest>=9.0.2",
]
